# Render Blueprint: New + → Blueprint → выберите репозиторий.
# Диск (disk) доступен только на платных тарифах; без него база и фото пропадут при перезапуске.
services:
  - type: web
    name: vkusno
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SITE_URL            # например https://vkusno.onrender.com, позже — ваш домен
        sync: false
      - key: ADMIN_PATH          # секретный адрес админки, например staff-k29x
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL      # первый администратор; после входа удалите
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: YANDEX_GEOCODER_KEY
        sync: false
